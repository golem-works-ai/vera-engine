# vera-engine configuration
# Place at ~/.vera-engine.toml or .vera-engine.toml in your workspace.

# Fraction of tokens that are input in a typical coding agent run.
# Code default is 0.8. This file uses the measured Vera staging value.
# Measured from Vera staging: 0.956 across 172k proxy requests.
# Higher values weight input cost more heavily in model selection.
input_weight = 0.95

[providers.anthropic]
# Pre-paid subscription: (subscription cost / expected value).
# Claude Code Max 20x: $200/mo with ~$2000/mo expected value = 0.1
cost_ratio = 0.1

[providers.openrouter]
# Retail markup + taxes.
cost_ratio = 1.01375

[providers.openai]
# A detected Codex OAuth subscription uses 0.1 unless overridden here.
cost_ratio = 0.1

[providers.xai]
# Pre-paid grok.com subscription: (subscription cost / expected value).
cost_ratio = 0.1
